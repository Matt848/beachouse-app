name: Publish beta to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours: refresh What's On from 38° The Bathhouse (Trybe)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh events from Trybe
        working-directory: beachouse-app
        run: node scripts/fetch-events.mjs docs/events.json || echo "Events refresh failed, keeping the last saved list"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: beachouse-app/docs
      - id: deployment
        uses: actions/deploy-pages@v4
