# Cloud iOS build: Codemagic builds on a Mac, signs with the Beachouse Apple developer account and uploads to TestFlight.
workflows:
  ios-release:
    name: Beachouse iOS release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Beachouse App Store Connect key   # name of the API key added in Codemagic > Team > Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.beachousebondi.app
      vars:
        APP_STORE_APPLE_ID: 6835252594   # Beachouse Health Club in App Store Connect
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install
        script: npm install
      - name: Add iOS project
        script: |
          [ -d ios ] || npx cap add ios
          # Apple requires iOS 15 or later from April 2027
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 1[0-4].0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '1[0-4].0'/platform :ios, '15.0'/" ios/App/Podfile
          # iPhone only (no iPad version)
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios
          # Beachouse app icon and launch screen (replace the Capacitor placeholders)
          cp resources/appicon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do cp resources/splash-2732.png "$f"; done
      - name: App permissions
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Scan the QR code on a machine to log your sets, and take a photo to share your session to your Instagram story.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Pick a photo to share your session to your Instagram story.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Save your session story image to your photos.'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :FacebookAppID string '1949031732729226'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string 'instagram-stories'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST || true
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App && agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: Build IPA
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # internal testers get each build automatically; external beta review not needed yet
