<style>
/* Layout: phone-first app shell — sticky top bar, scrolling view, fixed bottom tab bar. Single dark look to match the black loading screen. */
:root{
  --bg:#0b0b0b; --surface:#151515; --surface-2:#1e1e1e; --line:#2a2a2a;
  --fg:#f4f4f2; --muted:#9a9a96; --accent:#ffffff; --heat:#f2994a; --cold:#4fb0f0; --good:#8fd19e;
  --display:"Montserrat",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.wordmark{font-family:var(--display);font-weight:300;letter-spacing:.42em;font-size:15px;line-height:1}
.wordmark small{display:block;font-size:8px;letter-spacing:.35em;color:var(--muted);margin-top:5px}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
main{flex:1;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px;align-content:start}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
h1{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:.02em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:2px}
.stat b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;background:var(--accent);color:#0b0b0b;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:0 14px;font-size:13px}
.btn.block{width:100%}
.list{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .meta{font-size:12px;color:var(--muted)}
.item .chev{color:var(--muted)}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.pr{color:var(--good);border-color:var(--good)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(11,11,11,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{padding:10px 0 12px;display:grid;justify-items:center;gap:4px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.scanbtn{display:grid;place-items:center;gap:6px;aspect-ratio:2.4/1;max-width:100%;border:1px dashed var(--line);border-radius:14px;background:var(--surface);text-align:center}
.scanbtn svg{width:30px;height:30px;stroke:var(--fg);fill:none;stroke-width:1.4}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 44px 28px;gap:8px;align-items:center}
.set input{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--fg);font:inherit;font-variant-numeric:tabular-nums;text-align:center}
.set .n{color:var(--muted);font-size:13px;text-align:center}
.set button{height:36px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:grid;align-items:end}
.sheet .panel{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;max-width:520px;width:100%;margin:0 auto;max-height:88%;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:30}
.heat{color:var(--heat)} .cold{color:var(--cold)}
.ritual{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%}
.splash{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;transition:opacity .6s ease}
.splash .wordmark{font-size:22px;color:#fff;text-align:center}
.splash .wordmark small{font-size:10px;color:#cfcfcf}
.tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--muted)}
.week i{width:100%;aspect-ratio:1;border-radius:8px;background:var(--surface-2);display:block}
.week i.on{background:var(--fg)}
.week i.rec{background:var(--heat)}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
@media (prefers-reduced-motion:reduce){.splash{transition:none}}
</style>

</head>

.set.done input{border-color:var(--good)}

.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#0b0b0b}
.ib{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:11px;font-style:italic;font-family:Georgia,serif;margin-left:6px;vertical-align:middle;line-height:1;cursor:pointer}
.badge{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:600}
</style>

// Predicted busyness 0–1 by hour (6am–9pm). Replaced with real check-in data once Mindbody is linked.
function busyCurve(day){const wk=day>=1&&day<=5;const out=[];for(let h=6;h<=21;h++){let v;
 if(wk){v=.25+.7*Math.exp(-((h-7)**2)/2)+.75*Math.exp(-((h-18)**2)/2.2)+.25*Math.exp(-((h-12.5)**2)/1.5);if(day===5&&h>=19)v*=.4;}
 else{v=h>17?0:.2+.75*Math.exp(-((h-9.5)**2)/4);}
 out.push([h,Math.min(1,v)]);}return out;}

let WX={t:26,code:51,wind:11,uv:8,max:29,min:20,sea:21.4,wave:0.8};

async function loadWeather(){try{const [a,b]=await Promise.all([fetch('https://api.open-meteo.com/v1/forecast?latitude=-33.8915&longitude=151.2767&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,uv_index_max&timezone=Australia%2FSydney&forecast_days=1').then(r=>r.json()),fetch('https://marine-api.open-meteo.com/v1/marine?latitude=-33.8915&longitude=151.2767&current=wave_height,sea_surface_temperature&timezone=Australia%2FSydney').then(r=>r.json())]);
  WX={t:Math.round(a.current.temperature_2m),code:a.current.weather_code,wind:Math.round(a.current.wind_speed_10m),uv:Math.round(a.daily.uv_index_max[0]),max:Math.round(a.daily.temperature_2m_max[0]),min:Math.round(a.daily.temperature_2m_min[0]),sea:b.current.sea_surface_temperature,wave:b.current.wave_height};if(tab==='home')render();}catch(e){}}
function weatherCard(){return `<section class="card" style="grid-template-columns:auto 1fr;align-items:center;gap:14px">

  <span class="muted" style="font-size:12px">Bondi Beach · Water ${Math.round(WX.sea)}° · Waves ${Number(WX.wave).toFixed(1)}m · Wind ${WX.wind} km/h · UV ${WX.uv}</span></div></section>`;}

// ---------- Smart Coach engine (Fitbod-style) ----------
// Estimated strength: Epley e1RM from the best set of a session.
function e1rm(l){return Math.max(...l.sets.map(s=>s[0]*(1+s[1]/30)));}
// Muscle recovery 0–100%: each trained muscle recovers over ~72h, slower after big sessions or "hard" feedback.
function recovery(){
  const out={};Object.keys(MUSCLES).forEach(k=>out[k]=100);
  S.logs.forEach(l=>{const m=M(l.m);if(!m)return;const hrs=daysAgo(l.date)*24+12;
    // Heat or cold at 38° within 2 days after training speeds the muscle recovery score up to 25%.
    const boost=Math.min(.25,.1*S.rec.filter(r=>r.date>=l.date&&daysAgo(l.date)-daysAgo(r.date)<=2).length);
    const need=72*(l.fb==='hard'?1.25:1)*(l.sets.length>=4?1.15:1)*(1-boost);
    const pct=Math.min(100,Math.round(hrs/need*100));m.muscles.forEach(k=>{out[k]=Math.min(out[k],pct);});});
  return out;
}
// Next-session target for a machine: weight × reps × sets with progressive overload.
function target(id){
  const m=M(id);const g=GOALS[S.goal||'build'];const hist=logsFor(id);
  if(m.cardio){const l=hist[hist.length-1];return {text:l?`${Math.round(l.sets[0][0]*1.03)} ${m.unit}`:'Easy pace, 10 min',why:l?'3% more than last time':'First session: build a baseline',w:l?Math.round(l.sets[0][0]*1.03):0,r:1,sets:1};}
  if(!hist.length)return {text:'Find your start weight',why:'Pick a weight you could lift about 15 times. The app calibrates from there.',w:0,r:g.reps[1],sets:g.sets};
  const last=hist[hist.length-1];const n=hist.length;
  // Alternate heavier and lighter days like Fitbod's varied sessions.
  const heavy=n%2===0;let reps=heavy?g.reps[0]:g.reps[1];
  const est=e1rm(last);let w=est/(1+reps/30);let why;
  const topW=Math.max(...last.sets.map(s=>s[0]));const hitTop=last.sets.every(s=>s[1]>=g.reps[1]||s[0]<topW);
  const gap=daysAgo(last.date);
  if(gap>14){w*=0.9;why=`Back after ${gap} days, so 10% lighter to ease in`;}
  else if(last.fb==='hard'){w=Math.min(w,topW);why='Last time felt hard, so we hold the weight';}
  else if(last.fb==='easy'||hitTop){w=Math.max(w,topW+m.step);why='You beat your target last time, so the weight goes up';}
  else why=heavy?'Heavier day: fewer reps, more weight':'Lighter day: more reps to build volume';
  if(m.assist){w=Math.max(m.step,topW-(last.fb==='easy'||hitTop?m.step:0));why=last.fb==='easy'||hitTop?'Less assistance this time':'Same assistance, aim for more reps';}
  w=Math.min(w,topW+m.step);w=round(w,m.step);
  return {text:`${g.sets} × ${reps} @ ${w} ${m.unit}`,why,w,r:reps,sets:g.sets};
}
// Smart session: pick machines for the freshest muscle groups, one per group, 5 exercises.
function smartSession(){
  const rec=recovery();const used=new Set();const picks=[];
  const strength=MACHINES.filter(m=>!m.cardio).map(m=>({m,score:Math.min(...m.muscles.map(k=>rec[k]))+(lastLog(m.id)?0:-5)})).sort((a,b)=>b.score-a.score);
  for(const x of strength){if(picks.length>=4)break;if(x.score<60)continue;if(x.m.muscles.some(k=>used.has(k)))continue;x.m.muscles.forEach(k=>used.add(k));picks.push(x.m.id);}
  picks.push(['rower','ski','bike'][new Date().getDate()%3]);
  return picks;
}


// ---------- weekly goals ----------
// Recovery targets from Søberg et al. 2021 (winter swimmers): ~57 min of heat and ~11 min of cold a week, split over several sessions.
// Training: WHO advises muscle-strengthening 2+ days a week; members pick their own days (2–6).
const HEAT_GOAL=57,COLD_GOAL=11;
const PERIODS={day:{label:'Today',scale:1/7},week:{label:'This week',scale:1},month:{label:'This month',scale:30/7}};
function periodStart(p){const d=new Date();if(p==='day')return dayISO(0);if(p==='month'){d.setDate(1);return d.toISOString().slice(0,10);}return weekStart();}
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10);}
function weekTotals(p){const ws=periodStart(p||'week');
  const workouts=new Set(S.logs.filter(l=>l.date>=ws).map(l=>l.date)).size;
  let heat=0,cold=0,heatN=0,coldN=0;
  S.rec.filter(r=>r.date>=ws).forEach(r=>{const R=RITUALS.find(x=>x.id===r.r);const m=r.mins||R.mins;if(R.kind==='cold'){cold+=m;coldN++;}else{heat+=m;heatN++;}});
  return {workouts,heat,cold,heatN,coldN};}
function goalRow(label,val,goal,unit,note,col){const p=Math.min(100,Math.round(val/goal*100));col=col||'var(--good)';
  return `<div class="stack" style="gap:6px"><div class="row between"><span>${label}${note?ib(note):''}</span><span class="muted" style="font-variant-numeric:tabular-nums">${val}/${goal}${unit}${p>=100?' · done':''}</span></div><div class="bar" style="height:8px"><i style="width:${p}%;background:${col};opacity:${p>=100?1:.85}"></i></div></div>`;}

// ---------- Training + recovery balance ----------
const FOCUS={balanced:{label:'Balanced',w:1,h:1,c:1},perform:{label:'Train harder',w:1,h:1.2,c:1.2},recover:{label:'Recovery first',w:0.67,h:1.4,c:1.25}};
const INJURIES={shoulder:'Shoulder',elbow:'Elbow or wrist',back:'Lower back',hip:'Hip',knee:'Knee'};
const LOADS={'leg-press':['knee','hip'],'hack-squat':['knee','hip','back'],'leg-ext':['knee'],'leg-curl':[],'chest-press':['shoulder','elbow'],'shoulder-press':['shoulder','elbow'],'cable-cross':['shoulder'],'lat-pull':['elbow'],'seated-row':['back','elbow'],'assist-pull':['shoulder','elbow'],'smith':['knee','hip','back','shoulder'],'dumbbells':['elbow','shoulder'],'rower':['back'],'ski':['shoulder','back'],'bike':['knee']};
function blocked(id){const inj=S.injuries||[];return (LOADS[id]||[]).some(a=>inj.includes(a));}
function swapFor(id){const m=M(id);if(!blocked(id))return id;
  const alt=MACHINES.find(x=>x.id!==id&&!blocked(x.id)&&x.zone===m.zone)||MACHINES.find(x=>!blocked(x.id)&&x.cardio===!!m.cardio&&x.muscles.some(k=>m.muscles.includes(k)))||(['bike','rower','ski'].map(M).find(x=>!blocked(x.id)));
  return alt?alt.id:null;}
// Training load this week vs the 4-week average; a big jump means more recovery is needed.
function loadRatio(){const ws=weekStart();const wk=S.logs.filter(l=>l.date>=ws&&!M(l.m).cardio).reduce((a,l)=>a+vol(l),0);
  const past=S.logs.filter(l=>l.date<ws&&l.date>=dayISO(35)&&!M(l.m).cardio).reduce((a,l)=>a+vol(l),0)/4;return past?wk/past:0;}

function goalTargets(p){const sc=PERIODS[p].scale;const days=S.days||3;const f=FOCUS[S.focus||'balanced'];const rd=readiness();const hard=(loadRatio()>1.25?1.15:1)*(hasTip('recover')?1.2:1)*(rd!=null&&rd<34?1.2:1);
  return {workouts:p==='day'?1:Math.max(1,Math.round(days*sc*f.w)),heat:Math.round(HEAT_GOAL*sc*f.h*hard),cold:Math.max(2,Math.round(COLD_GOAL*sc*f.c*hard))};}
function coachNote(){const r=loadRatio();const f=S.focus||'balanced';const inj=(S.injuries||[]).map(k=>INJURIES[k].toLowerCase());
  const bits=[];if(r>1.25)bits.push(`You've trained ${Math.round((r-1)*100)}% harder than your usual week, so your recovery goal is higher.`);

  if(inj.length)bits.push(`Working around your ${inj.join(' and ')}: machines that load ${inj.length>1?'them':'it'} are swapped out.`);
  return bits.length?`<p class="note">${bits.join(' ')}</p>`:'';}

function lineChart(points){
  const w=340,h=140;
  if(points.length<2)return '<p class="muted">Log a couple of sessions to see your trend.</p>';
  const pad={l:34,r:10,t:12,b:22};const ys=points.map(p=>p[1]);
  let min=Math.min(...ys),max=Math.max(...ys);if(min===max){min-=1;max+=1;}const sp=max-min;min-=sp*.1;max+=sp*.1;
  const X=i=>pad.l+(w-pad.l-pad.r)*i/(points.length-1);const Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-min)/(max-min));
  const path=points.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const area=path+` L${X(points.length-1).toFixed(1)} ${h-pad.b} L${X(0).toFixed(1)} ${h-pad.b} Z`;
  const ticks=[min+(max-min)*.15,min+(max-min)*.5,min+(max-min)*.85];const last=points[points.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend chart">
   ${ticks.map(t=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l-6}" y="${Y(t)+3}" text-anchor="end">${Math.round(t)}</text>`).join('')}
   <path d="${area}" fill="var(--fg)" fill-opacity=".07"/><path d="${path}" fill="none" stroke="var(--fg)" stroke-width="1.6"/>
   <circle cx="${X(points.length-1)}" cy="${Y(last[1])}" r="3.5" fill="var(--fg)"/>
   <text x="${pad.l}" y="${h-6}">${fmtDate(points[0][0])}</text><text x="${w-pad.r}" y="${h-6}" text-anchor="end">${fmtDate(last[0])}</text></svg>`;
}

function rng(mk){if(mk.r)return mk.r;return (S.sex==='f'?mk.f:mk.m);}
function mstatus(mk,v){const [lo,hi]=rng(mk);if(v<lo)return 'low';if(v>hi)return 'high';return 'ok';}
function lastTest(){return (S.bloods||[]).slice().sort((a,b)=>a.date<b.date?1:-1)[0];}
function prevValue(id,beforeDate){const t=(S.bloods||[]).filter(b=>b.date<beforeDate&&b.v[id]!=null).sort((a,b)=>a.date<b.date?1:-1)[0];return t?t.v[id]:null;}
function nextDue(){const t=lastTest();if(!t)return null;const d=new Date(t.date+'T00:00');d.setMonth(d.getMonth()+3);return d.toISOString().slice(0,10);}
function rangeBar(mk,v){const [lo,hi]=rng(mk);const max=hi*1.5||1,min=lo>0?lo*0.5:0;const X=x=>Math.max(0,Math.min(100,(x-min)/(max-min)*100));
 return `<div style="position:relative;height:8px;border-radius:4px;background:var(--surface-2)"><div style="position:absolute;left:${X(lo)}%;width:${X(hi)-X(lo)}%;top:0;bottom:0;background:rgba(143,209,158,.25);border-radius:4px"></div><div style="position:absolute;left:calc(${X(v)}% - 5px);top:-2px;width:10px;height:12px;border-radius:3px;background:${mstatus(mk,v)==='ok'?'var(--good)':'var(--heat)'}"></div></div>`;}

   <a class="btn small" style="justify-self:start" href="tel:${CLINIC.phone.replace(/\s/g,'')}">Call ${CLINIC.name}</a></section>`;
  const groups=[...new Set(MARKERS.map(m=>m.grp))];
  out+=`<section class="stack"><div class="row between"><h2>Results · ${fmtDate(t.date)}</h2><span class="muted" style="font-size:12px">vs previous</span></div>
   ${groups.map(g=>{const ms=MARKERS.filter(m=>m.grp===g&&t.v[m.id]!=null);if(!ms.length)return '';return `<div class="card"><h3 style="font-size:14px">${g}</h3>${ms.map(mk=>{const v=t.v[mk.id];const p=prevValue(mk.id,t.date);const [lo,hi]=rng(mk);const st=mstatus(mk,v);
     return `<div class="stack" style="gap:6px"><div class="row between"><span>${mk.name}</span><span style="font-variant-numeric:tabular-nums">${v} <span class="muted">${mk.unit}</span>${p!=null?` <span class="muted">${v>p?'↑':v<p?'↓':'→'} ${p}</span>`:''}</span></div>${rangeBar(mk,v)}<span class="muted" style="font-size:11px">Typical ${lo>0?lo+'–':'under '}${hi} ${mk.unit}${st!=='ok'?` · <span class="heat">${st==='low'?'below':'above'} range</span>`:''}</span></div>`}).join('')}</div>`}).join('')}

// Live app: POST /api/coach on our own server, which calls Claude with the Beachouse guidelines. Preview: Claude via the page's sample capability.
const COACH_RULES=`You are Beachouse Coach, the in-app assistant for Beachouse Health Club, a gym in Bondi Beach with 38° The Bathhouse (sauna, steam, ice bath, 38° mineral bath) downstairs.
Guidelines:
- Help with training technique, workout plans, progression, recovery, sleep, general nutrition habits and using the app.
- Keep answers short, warm and practical: 2-5 short sentences or a few bullet points. Australian English.
- You are not a doctor or physio. Never diagnose, never interpret blood results as a diagnosis, never suggest medication, supplements doses or treatments. If something sounds medical, painful, or a blood marker is outside range, say it's worth checking with a health professional and suggest Bondi Doctors (02 9365 2833) or a Beachouse coach.
- For injuries, suggest avoiding painful movements and seeing a physio; you can suggest gentler alternatives on the machines.
- For heat and cold: general guidance only (e.g. about 57 min heat and 11 min cold a week across sessions); anyone pregnant, with heart conditions or high blood pressure should check with a doctor first.
- For memberships, prices or bookings, point to the Club tab or support@beachousebondi.com.
- If asked about anything unrelated to health, fitness or Beachouse, politely steer back.`;
function coachContext(){const t=weekTotals('week');const lt=lastTest();const flagged=lt?MARKERS.filter(mk=>lt.v[mk.id]!=null&&mstatus(mk,lt.v[mk.id])!=='ok').map(m=>m.name):[];
  const recent=S.logs.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,6).map(l=>`${l.date} ${M(l.m).name}: ${l.sets.map(x=>x[0]+'x'+x[1]).join(', ')}${l.fb?' ('+l.fb+')':''}`).join('; ');
  return `Member context: name ${S.name||'unknown'}; goal ${GOALS[S.goal||'build'].label}; ${S.days||3} training days a week; focus ${FOCUS[S.focus||'balanced'].label}; injuries ${(S.injuries||[]).map(k=>INJURIES[k]).join(', ')||'none'}; this week ${t.workouts} workouts, ${t.heat} min heat, ${t.cold} min cold; recent sets: ${recent||'none'}; blood markers outside range: ${flagged.join(', ')||'none recorded'}; app suggestions from results: ${resultTips().map(x=>x.title).join(', ')||'none'}; food focus: ${appliedFood().map(k=>FOOD_FOCUS[k].t).join(', ')||'none'}; DEXA suggestions pending: ${dexaSuggestions().map(x=>x.title).join(', ')||'none'}; wearable: ${S.wear?DEVICES[S.wear]+' recovery '+WEAR_DEMO.recovery+'%, HRV '+WEAR_DEMO.hrv+' ms, sleep '+WEAR_DEMO.sleep+' h':'none connected'}.`;}
async function askCoach(history,onText){
  const sys=COACH_RULES+'\n\n'+coachContext();
  if(location.protocol.startsWith('http')&&!/claude|claudeusercontent/.test(location.host)){
    const r=await fetch('/api/coach',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({system:sys,messages:history})});
    if(!r.ok)throw new Error('coach_unavailable');const j=await r.json();return j.text;}
  const sample=window.claude&&await window.claude.use('sample');if(!sample)throw new Error('coach_unavailable');
  const msgs=[{role:'user',content:sys+'\n\nReply to the member’s latest message. Conversation follows.'},{role:'assistant',content:'Understood.'},...history];
  const r=await sample(msgs,{onText:({text})=>onText&&onText(text),cache:false,modelTier:'quick'});return r.text;}

function resultTips(){const t=lastTest();const tips=[];if(!t)return tips;const st=id=>{const mk=MARKERS.find(m=>m.id===id);return t.v[id]!=null?mstatus(mk,t.v[id]):'ok';};
  if(['ldl','chol','trig','glucose','hba1c'].some(k=>st(k)==='high')||st('hdl')==='low')tips.push({k:'cardio',title:'Add steady cardio',body:'Some heart or blood sugar markers are above range. Regular moderate cardio is one of the best-supported habits for these: aim for 30 minutes of brisk walking on the treadmill or easy bike, 5 days a week.',goal:150});
  if(st('vitd')==='low')tips.push({k:'sun',title:'Train outside when you can',body:'Vitamin D is below range. Our bodies make it from sunlight, so a morning run club or outdoor session helps. Ask your doctor whether you need more.'});
  if(st('crp')==='high')tips.push({k:'recover',title:'Prioritise recovery',body:'Your inflammation marker is up. We’ve eased your training and raised your heat and cold goal for now. Check with your doctor if it stays high.'});
  if(st('ferritin')==='low'||st('hb')==='low'||st('iron')==='low')tips.push({k:'easy',title:'Keep intensity moderate',body:'Iron or haemoglobin is below range, which can make hard sessions feel tougher. Keep sessions moderate and talk to your doctor before pushing intensity.'});
  return tips;}
function hasTip(k){const t=lastTest();return !!t&&(S.applied||{})[t.date]&&resultTips().some(x=>x.k===k);}
function cardioWeek(){const ws=weekStart();return S.logs.filter(l=>l.date>=ws&&M(l.m).cardio).length*20;}

// General training guidance from body-composition balance. Members approve changes before their plan updates.
function dexaSuggestions(){const sc=(S.dexa||[]).slice().sort((a,b)=>a.date<b.date?-1:1);const d=sc[sc.length-1];if(!d)return [];const v=d.v,out=[];
  const gap=(a,b)=>a&&b?Math.abs(a-b)/Math.max(a,b):0;
  if(gap(v.la,v.ra)>0.05){const weak=v.la<v.ra?'left':'right';out.push({id:'arms',title:`Even up your arms`,why:`Your ${weak} arm has ${Math.round(gap(v.la,v.ra)*100)}% less lean mass than your other arm.`,add:['dumbbells','cable-cross'],note:'Single-arm dumbbell and cable work, starting with your '+weak+' side.'});}
  if(gap(v.ll,v.rl)>0.05){const weak=v.ll<v.rl?'left':'right';out.push({id:'legs-lr',title:'Even up your legs',why:`Your ${weak} leg has ${Math.round(gap(v.ll,v.rl)*100)}% less lean mass than your other leg.`,add:['leg-ext','leg-curl'],note:'Single-leg extensions and curls, starting with your '+weak+' leg.'});}
  if(v.la&&v.ra&&v.ll&&v.rl){const share=(v.ll+v.rl)/(v.la+v.ra+v.ll+v.rl);
    if(share<0.7)out.push({id:'lower',title:'Build your lower body',why:'Your legs carry less of your muscle than typical for your upper body.',add:['leg-press','hack-squat'],note:'Adds leg press and hack squat to your sessions.'});
    else if(share>0.8)out.push({id:'upper',title:'Build your upper body',why:'Your upper body carries less of your muscle than typical for your legs.',add:['chest-press','lat-pull'],note:'Adds chest press and lat pulldown to your sessions.'});}
  const bfHigh=v.bf!=null&&v.bf>(S.sex==='f'?32:25), vatHigh=v.vat!=null&&v.vat>1000;
  if(bfHigh||vatHigh)out.push({id:'cardio',title:'Add a cardio finisher',why:vatHigh?'Visceral (deep belly) fat is above the typical range.':'Body fat is above the typical range.',add:['rower'],note:'A 10-minute rower finisher at the end of each session.'});
  return out.filter(x=>!(S.dexaDone||[]).includes(x.id));}
function planAdds(){return S.planAdds||[];}
function dexaSuggestCard(){const sg=dexaSuggestions();const added=planAdds();

function machineSheet(id){
  const m=M(id);const t=target(id);const b=best(id);const hist=logsFor(id).map(x=>[x.date,Math.round(m.cardio?x.sets[0][0]:e1rm(x))]);

    <div class="sets" id="sets"></div>
    <div class="row between"><button class="btn ghost small" id="addSet">+ Add set</button>${restFor(id)?`<span class="muted" style="font-size:12px">Rest ${fmtS(restFor(id))} between sets</span>`:''}</div>
    <div class="stack"><h2>How did that feel?</h2><div class="fb" role="group" aria-label="Effort">${[['easy','Easy'],['right','About right'],['hard','Hard']].map(([k,l])=>`<button data-fbv="${k}" aria-pressed="${k==='right'}">${l}</button>`).join('')}</div></div>

    ${hist.length>1?`<div class="stack"><h2>${m.cardio?'Distance':'Estimated strength'} trend</h2>${lineChart(hist)}</div>`:''}
  `,s=>{
    let sets=start,fb='right',done=[];
    const draw=()=>{s.querySelector('#sets').innerHTML=`<div class="set"><span></span><span class="tag" style="text-align:center">${m.cardio?'Distance ('+m.unit+')':'Weight (kg)'}</span><span class="tag" style="text-align:center">${m.cardio?'Rounds':'Reps'}</span><span class="tag" style="text-align:center">Done</span><span></span></div>`+sets.map((x,i)=>`<div class="set${done[i]?' done':''}"><span class="n">${i+1}</span><input id="w${i}" inputmode="decimal" aria-label="Set ${i+1} ${m.cardio?'distance':'weight'}" value="${x[0]}"><input id="r${i}" inputmode="numeric" aria-label="Set ${i+1} reps" value="${x[1]}"><button class="tick" data-tick="${i}" aria-pressed="${!!done[i]}" aria-label="Set ${i+1} done">✓</button><button data-del="${i}" aria-label="Remove set ${i+1}" style="color:var(--muted)">×</button></div>`).join('');};
    const read=()=>{sets=sets.map((x,i)=>[parseFloat(s.querySelector('#w'+i).value)||0,parseInt(s.querySelector('#r'+i).value)||0]);};
    draw();
    s.querySelector('#addSet').onclick=()=>{read();sets.push((sets[sets.length-1]||[t.w,t.r]).slice());draw();};
    s.querySelector('#sets').addEventListener('click',e=>{const d=e.target.dataset.del;if(d!==undefined){read();sets.splice(+d,1);done.splice(+d,1);draw();return;}
      const k=e.target.dataset.tick;if(k!==undefined){read();done[+k]=!done[+k];draw();if(done[+k]){if(!S.sess){S.sess=Date.now();save();}const last=done.filter(Boolean).length>=sets.length;if(last){stopRest();toast('All sets done. Save your session');}else startRest(restFor(id));}}});
    s.querySelectorAll('[data-fbv]').forEach(btn=>btn.onclick=()=>{fb=btn.dataset.fbv;s.querySelectorAll('[data-fbv]').forEach(x=>x.setAttribute('aria-pressed',x===btn));});

      const prev=best(id);S.logs.push({m:id,date:dayISO(0),sets:valid,fb});stopRest();save();closeSheet();render();
      const nb=Math.max(...valid.map(x=>x[0]));const nt=target(id);
      toast(nb>prev&&prev>0?`New best on ${m.name}: ${nb}${m.unit}`:`Saved. Next time: ${nt.text}`);};
  });
}
let stream=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function idFromQR(txt){const m=String(txt).match(/m=([a-z0-9-]+)/i);return m&&M(m[1])?m[1]:(M(txt)?txt:null);}
async function startCam(s){
  const v=s.querySelector('#cam');const c=document.createElement('canvas');const ctx=c.getContext('2d',{willReadFrequently:true});
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){s.querySelector('#camMsg').textContent='Camera not available. Pick the machine below.';v.hidden=true;return;}
  v.srcObject=stream;await v.play();
  const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
  const tick=async()=>{if(!stream||!document.body.contains(v))return stopCam();
    let txt=null;
    try{if(det){const r=await det.detect(v);if(r[0])txt=r[0].rawValue;}else if(window.jsQR&&v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0);const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r)txt=r.data;}}catch(e){}
    const id=txt&&idFromQR(txt);if(id){stopCam();machineSheet(id);return;}
    requestAnimationFrame(tick);};
  tick();
}

});

function infoPop(txt){const o=document.createElement('div');o.className='sheet';o.style.zIndex=40;o.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><p style="font-size:15px;line-height:1.55">${txt}</p><button class="btn block">Got it</button></div>`;o.addEventListener('click',e=>{if(e.target===o||e.target.closest('button'))o.remove();});document.body.appendChild(o);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-info]');if(b){e.stopPropagation();e.preventDefault();infoPop(b.dataset.info);}},true);
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(VIEWS[h]&&h!==tab){tab=h;render();}});
render();
if(deep&&M(deep)){history.replaceState(null,'',location.pathname);setTimeout(()=>machineSheet(deep),950);}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{const s=$('#splash');s.style.opacity='0';setTimeout(()=>s.remove(),700);},900);
})();
</script>
