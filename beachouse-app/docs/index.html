<style>
/* Layout: phone-first app shell — sticky top bar, scrolling view, fixed bottom tab bar. Single dark look to match the black loading screen. */
:root{
  --bg:#0b0b0b; --surface:#151515; --surface-2:#1e1e1e; --line:#2a2a2a;

.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

.wordmark{font-family:var(--display);font-weight:300;letter-spacing:.42em;font-size:15px;line-height:1}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:grid;align-items:end}
.sheet .panel{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;max-width:520px;width:100%;margin:0 auto;max-height:88%;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:30}
.heat{color:var(--heat)} .cold{color:var(--cold)}
.ritual{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%}

.tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--muted)}
.week i{width:100%;aspect-ratio:1;border-radius:8px;background:var(--surface-2);display:block}
.week i.on{background:var(--fg)}
.week i.rec{background:var(--heat)}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
@media (prefers-reduced-motion:reduce){.splash{transition:none}}
</style>

</head>

<style>
/* Luxury pass: warm ivory on deep black, serif display type, champagne accents, glass bars, gentle motion. */
:root{
  --bg:#090908; --surface:#121211; --surface-2:#1a1917; --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
  --fg:#F4EEE6; --muted:#9a9187; --accent:#F4EEE6; --gold:#C8A27A; --gold-2:#E3D4C0; --good:#a7bfa0; --heat:#c9714a; --cold:#3d93c4;
  --serif:"Montserrat",Helvetica,Arial,sans-serif;
}
body{background:radial-gradient(120% 50% at 50% -8%,#1b1813 0%,rgba(9,9,8,0) 60%) no-repeat,var(--bg);letter-spacing:.005em}
header.top{background:rgba(9,9,8,.72);-webkit-backdrop-filter:saturate(140%) blur(18px);backdrop-filter:saturate(140%) blur(18px);border-bottom:1px solid var(--line);padding-block:16px}

h2{font-size:10.5px;letter-spacing:.22em}
h3{font-family:var(--serif);font-size:22px;font-weight:500}
.tag{color:var(--gold);letter-spacing:.22em;font-size:10.5px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 45%),var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;gap:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 40px -28px rgba(0,0,0,.9)}
.list{border-radius:20px;border-color:var(--line)}
.item{padding:16px 18px;border-bottom-color:var(--line);transition:background .2s ease}
.item:active{background:var(--surface-2)}
.item b{font-weight:500}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)),var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px}
.stat b{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1}
.stat span{font-size:9.5px;letter-spacing:.16em}
.btn{background:var(--fg);color:#0c0b09;font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:12px;transition:transform .15s ease,opacity .2s ease}

.btn.ghost{border-color:var(--line-2)}
.btn.small{font-size:11px}
.btn.gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#15120c}
.chip{border-color:var(--line-2);font-size:12.5px;transition:background .2s,color .2s}

.btn{text-transform:none;letter-spacing:.01em;font-size:14px;font-weight:500}

.nextw{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px}

// Predicted busyness 0–1 by hour (6am–9pm). Replaced with real check-in data once Mindbody is linked.
// Opening hours by weekday (0 = Sunday): [open hour, closing hour]. Weekends 7am to 5:30pm, Friday to 8pm, Mon-Thu to 9pm.
const OPEN={0:[7,17.5],1:[6,21],2:[6,21],3:[6,21],4:[6,21],5:[6,20],6:[7,17.5]};
function busyCurve(day){const wk=day>=1&&day<=5;const [o,c]=OPEN[day];const out=[];for(let h=o;h<c;h++){let v;
 if(wk){v=.2+.7*Math.exp(-((h-7)**2)/2)+.75*Math.exp(-((h-18)**2)/2.2)+.25*Math.exp(-((h-12.5)**2)/1.5);if(day===5&&h>=17)v*=.6;}
 else{v=.15+.8*Math.exp(-((h-9)**2)/3.5);}
 out.push([h,Math.min(1,v)]);}return out;}
function busyLevel(v){return v>=.7?{l:'Busy',c:'#d6735f'}:v>=.42?{l:'Not so busy',c:'var(--gold)'}:{l:'Quiet',c:'var(--good)'};}
const hLabel=h=>{const hh=Math.floor(h),x=hh%12||12;return x+(h%1?':30':'')+(hh<12?'am':'pm');};
function quietest(day){const pts=busyCurve(day);let best=null;for(let i=0;i+2<pts.length;i++){const a=(pts[i][1]+pts[i+1][1]+pts[i+2][1])/3;if(!best||a<best.a)best={a,h:pts[i][0]};}return best?`${hLabel(best.h)} – ${hLabel(Math.min(best.h+3,OPEN[day][1]))}`:'';}

// Estimated strength: Epley e1RM from the best set of a session.
function e1rm(l){return Math.max(...l.sets.map(s=>s[0]*(1+s[1]/30)));}

// Next-session target for a machine: weight × reps × sets with progressive overload.
function target(id){
  const m=M(id);const g=GOALS[S.goal||'build'];const hist=logsFor(id);
  if(m.cardio){const l=hist[hist.length-1];return {text:l?`${Math.round(l.sets[0][0]*1.03)} ${m.unit}`:'Easy pace, 10 min',why:l?'3% more than last time':'First session: build a baseline',w:l?Math.round(l.sets[0][0]*1.03):0,r:1,sets:1};}
  if(!hist.length)return {text:'Find your start weight',why:'Pick a weight you could lift about 15 times. The app calibrates from there.',w:0,r:g.reps[1],sets:g.sets};
  const last=hist[hist.length-1];const n=hist.length;
  // Alternate heavier and lighter days like Fitbod's varied sessions.
  const heavy=n%2===0;let reps=heavy?g.reps[0]:g.reps[1];
  const est=e1rm(last);let w=est/(1+reps/30);let why;
  const topW=Math.max(...last.sets.map(s=>s[0]));const hitTop=last.sets.every(s=>s[1]>=g.reps[1]||s[0]<topW);
  const gap=daysAgo(last.date);
  if(gap>14){w*=0.9;why=`Back after ${gap} days, so 10% lighter to ease in`;}
  else if(last.fb==='hard'){w=Math.min(w,topW);why='Last time felt hard, so we hold the weight';}
  else if(last.fb==='easy'||hitTop){w=Math.max(w,topW+m.step);why='You beat your target last time, so the weight goes up';}
  else why=heavy?'Heavier day: fewer reps, more weight':'Lighter day: more reps to build volume';
  if(m.assist){w=Math.max(m.step,topW-(last.fb==='easy'||hitTop?m.step:0));why=last.fb==='easy'||hitTop?'Less assistance this time':'Same assistance, aim for more reps';}
  if(typeof condFlag==='function'&&condFlag('hold')){w=Math.min(w,topW);why='Holding your weight steady for your health condition';}
  const fat=Math.min(...m.muscles.map(k=>(recovery()[k]??100)));if(!m.cardio&&fat<60){w*=0.9;why=`${m.muscles.map(k=>MUSCLES[k]).join(' and ')} only ${fat}% recovered, so 10% lighter today`;}
  w=Math.min(w,topW+m.step);w=round(w,m.step);
  return {text:`${g.sets} × ${reps} @ ${w} ${m.unit}`,why,w,r:reps,sets:g.sets};
}
// Smart session: pick machines for the freshest muscle groups, one per group, 5 exercises.
function smartSession(){

  const strength=MACHINES.filter(m=>!m.cardio).map(m=>({m,score:Math.min(...m.muscles.map(k=>rec[k]))+(lastLog(m.id)?0:-5)})).sort((a,b)=>b.score-a.score);
  for(const x of strength){if(picks.length>=4)break;if(x.score<60)continue;if(x.m.muscles.some(k=>used.has(k)))continue;x.m.muscles.forEach(k=>used.add(k));picks.push(x.m.id);}
  picks.push(['rower','ski','bike'][new Date().getDate()%3]);

}

 iron:{t:'Iron-rich foods',f:'Lean red meat, chicken thigh, lentils, chickpeas, spinach, tofu. Pair with vitamin C (citrus, capsicum) and keep tea and coffee away from meals.'},
 b12:{t:'Vitamin B12',f:'Eggs, fish, dairy, lean meat. If you eat plant-based, ask your doctor about B12.'},
 vitd:{t:'Vitamin D',f:'Oily fish (salmon, sardines), eggs, UV-exposed mushrooms, plus safe morning sun.'},
 heart:{t:'Heart-friendly swaps',f:'Oats, beans and lentils, nuts, olive oil, oily fish twice a week. Cut back on fried food, processed meat and butter.'},
 sugar:{t:'Steady blood sugar',f:'Wholegrains, plenty of fibre, protein at every meal. Swap soft drinks and juice for water.'},

function quickStart(){
  const st={name:S.name||'',goal:S.goal||'build',days:S.days||3,focus:S.focus||'balanced',level:'start',injuries:(S.injuries||[]).slice(),w:{}};
  const LV={start:['New to the gym','start'],some:['Trained before','strength'],lots:['Train most weeks','build']};
  const steps=['name','goal','days','level','body','weights','done'];let i=0;
  const inp='style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);font:inherit;width:100%;min-width:0"';
  const chip=(attr,k,l,on)=>`<button class="chip" ${attr}="${k}" aria-pressed="${on}">${l}</button>`;
  function body(){const s=steps[i];
    if(s==='name')return `<h1 style="font-size:22px">Welcome to Beachouse</h1><p class="muted">Let's set up your training in under a minute.</p><label class="stack"><span class="tag">What should we call you?</span><input id="qn" ${inp} value="${esc(st.name)}"></label>`;
    if(s==='goal')return `<h1 style="font-size:22px">What do you want to achieve?</h1><div class="stack">${Object.entries(GOALS).map(([k,g])=>`<button class="item" style="border:1px solid ${st.goal===k?'var(--fg)':'var(--line)'};border-radius:12px" data-qg="${k}"><span><b>${g.label}</b><br><span class="meta">${g.reps[0]}–${g.reps[1]} reps, ${g.sets} sets</span></span><span>${st.goal===k?'●':'○'}</span></button>`).join('')}</div>`;
    if(s==='days')return `<h1 style="font-size:22px">How many days a week can you train?</h1><div class="chips" style="flex-wrap:wrap">${[2,3,4,5,6].map(n=>chip('data-qd',n,n+' days',st.days===n)).join('')}</div><p class="muted" style="font-size:13px">Most people do best on 3 or 4.</p>`;
    if(s==='level')return `<h1 style="font-size:22px">How much have you trained before?</h1><div class="stack">${Object.entries(LV).map(([k,[l]])=>`<button class="item" style="border:1px solid ${st.level===k?'var(--fg)':'var(--line)'};border-radius:12px" data-ql="${k}"><b>${l}</b><span>${st.level===k?'●':'○'}</span></button>`).join('')}</div>`;
    if(s==='body')return `<h1 style="font-size:22px">Anything we should work around?</h1><span class="tag">Focus</span><div class="chips" style="flex-wrap:wrap">${Object.entries(FOCUS).map(([k,f])=>chip('data-qf',k,f.label,st.focus===k)).join('')}</div><span class="tag">Injuries</span><div class="chips" style="flex-wrap:wrap">${Object.entries(INJURIES).map(([k,l])=>chip('data-qi',k,l,st.injuries.includes(k))).join('')}</div><p class="muted" style="font-size:13px">Machines that load an injured area are swapped out of your plan.</p>`;
    if(s==='weights'){const plan=PLANS.find(p=>p.id===(st.focus==='glutes'?'glutes':LV[st.level][1]));const pi=S.injuries;S.injuries=st.injuries;const ids=[...new Set(plan.days.flatMap(d=>d.items).map(swapFor).filter(id=>id&&!M(id).cardio))].slice(0,6);S.injuries=pi;
      return `<h1 style="font-size:22px">Know your weights?</h1><p class="muted" style="font-size:13px">Optional. Add what you can lift for about 10 reps and we'll start you there. Leave blank and the app works it out as you go.</p>${ids.map(id=>`<div class="set" style="grid-template-columns:1fr 110px"><label for="qw_${id}" style="font-size:14px">${M(id).name}</label><input id="qw_${id}" inputmode="decimal" placeholder="kg" ${inp} style="text-align:center" value="${st.w[id]||''}"></div>`).join('')}`;}
    const plan=PLANS.find(p=>p.id===(st.focus==='glutes'?'glutes':LV[st.level][1]));
    return `<h1 style="font-size:22px">You're set, ${esc(st.name||'there')}</h1><div class="card"><b>${plan.name}</b><span class="muted" style="font-size:13px">${plan.about}</span><span class="muted" style="font-size:13px">Goal: ${GOALS[st.goal].label} · ${st.days} days a week</span></div><p class="muted" style="font-size:13px">Scan the QR code on any machine to see your weight for today. You can change all of this in your profile.</p>`;}
  function read(s){const q=x=>s.querySelector(x);if(steps[i]==='name')st.name=(q('#qn').value||'').trim();
    if(steps[i]==='weights')s.querySelectorAll('[id^=qw_]').forEach(e=>{const v=parseFloat(e.value);if(v>0)st.w[e.id.slice(3)]=v;});}
  function draw(s){s.querySelector('#qb').innerHTML=body();s.querySelector('#qp').style.width=Math.round((i)/(steps.length-1)*100)+'%';
    s.querySelector('#qback').hidden=i===0;s.querySelector('#qnext').textContent=i===steps.length-1?'Start training':'Next';}
  openSheet(`<div class="bar" style="height:4px"><i id="qp" style="background:var(--good)"></i></div><div id="qb" class="stack" style="gap:14px"></div><div class="row between"><button class="btn ghost small" id="qback">Back</button><button class="btn" id="qnext">Next</button></div>`,s=>{
    draw(s);
    s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

      else if(b.dataset.qf){st.focus=b.dataset.qf;draw(s);}else if(b.dataset.qi){const k=b.dataset.qi;st.injuries=st.injuries.includes(k)?st.injuries.filter(x=>x!==k):st.injuries.concat(k);draw(s);}
      else if(b.id==='qback'){read(s);i--;draw(s);}
      else if(b.id==='qnext'){read(s);if(i<steps.length-1){i++;draw(s);return;}
        Object.assign(S,{name:st.name||S.name,goal:st.goal,days:st.days,focus:st.focus,injuries:st.injuries,plan:st.focus==='glutes'?'glutes':LV[st.level][1],planDay:0,onboarded:true});
        Object.entries(st.w).forEach(([id,kg])=>S.logs.push({m:id,date:dayISO(0),sets:[[kg,10]],fb:'right',start:true}));
        save();closeSheet();tab='home';render();toast('Your plan is ready');}});});
}


// ---------- DEXA shape suggestions ----------
// General training guidance from body-composition balance. Members approve changes before their plan updates.
function dexaSuggestions(){const sc=(S.dexa||[]).slice().sort((a,b)=>a.date<b.date?-1:1);const d=sc[sc.length-1];if(!d)return [];const v=d.v,out=[];
  const gap=(a,b)=>a&&b?Math.abs(a-b)/Math.max(a,b):0;
  if(gap(v.la,v.ra)>0.05){const weak=v.la<v.ra?'left':'right';out.push({id:'arms',title:`Even up your arms`,why:`Your ${weak} arm has ${Math.round(gap(v.la,v.ra)*100)}% less lean mass than your other arm.`,add:['dumbbells','cable-cross'],note:'Single-arm dumbbell and cable work, starting with your '+weak+' side.'});}
  if(gap(v.ll,v.rl)>0.05){const weak=v.ll<v.rl?'left':'right';out.push({id:'legs-lr',title:'Even up your legs',why:`Your ${weak} leg has ${Math.round(gap(v.ll,v.rl)*100)}% less lean mass than your other leg.`,add:['leg-ext','leg-curl'],note:'Single-leg extensions and curls, starting with your '+weak+' leg.'});}
  if(v.la&&v.ra&&v.ll&&v.rl){const share=(v.ll+v.rl)/(v.la+v.ra+v.ll+v.rl);
    if(share<0.7)out.push({id:'lower',title:'Build your lower body',why:'Your legs carry less of your muscle than typical for your upper body.',add:['leg-press','hack-squat'],note:'Adds leg press and hack squat to your sessions.'});
    else if(share>0.8)out.push({id:'upper',title:'Build your upper body',why:'Your upper body carries less of your muscle than typical for your legs.',add:['chest-press','lat-pull'],note:'Adds chest press and lat pulldown to your sessions.'});}
  const bfHigh=v.bf!=null&&v.bf>(S.sex==='f'?32:25), vatHigh=v.vat!=null&&v.vat>1000;
  if(bfHigh||vatHigh)out.push({id:'cardio',title:'Add a cardio finisher',why:vatHigh?'Visceral (deep belly) fat is above the typical range.':'Body fat is above the typical range.',add:['rower'],note:'A 10-minute rower finisher at the end of each session.'});
  return out.filter(x=>!(S.dexaDone||[]).includes(x.id));}
function planAdds(){return S.planAdds||[];}
function dexaSuggestCard(){const sg=dexaSuggestions();const added=planAdds();
  if(!sg.length&&!added.length)return '';
  return `<section class="card" style="border-color:${sg.length?'var(--good)':'var(--line)'}"><div class="row between"><h2>Suggested from your DEXA${ib('General training guidance from your scan, not medical advice. Approved exercises are added to your sessions. You can undo any time.')}</h2>${sg.length?'<span class="ai">Ready to apply</span>':''}</div>
   ${sg.map(x=>`<div class="stack" style="gap:4px"><div class="row between"><b>${x.title}</b><button class="btn ghost small" data-dxa="${x.id}">Approve</button></div><span class="muted" style="font-size:13px">${x.why} ${x.note}</span></div>`).join('')}
   ${sg.length>1?'<button class="btn block" data-act="dxall">Approve all</button>':''}
   ${added.length?`<p class="note">Added to your plan: ${added.map(id=>M(id).name).join(', ')}. <button class="muted" style="text-decoration:underline;font-size:12px" data-act="dxreset">Undo</button></p>`:''}
   </section>`;}
function applyDexa(ids){const sg=dexaSuggestions().filter(x=>ids.includes(x.id));if(!sg.length)return;
  S.planAdds=[...new Set(planAdds().concat(sg.flatMap(x=>x.add)))];S.dexaDone=(S.dexaDone||[]).concat(sg.map(x=>x.id));save();render();toast(sg.length>1?'All changes applied to your plan':'Applied to your plan');}


// ---------- Rest timer and session clock ----------
// Rest between sets by goal: strength 2.5 min, build muscle 75 s, fit and lean 45 s; big lower-body lifts get 30 s extra.
const REST={strength:150,build:75,fit:45};
const BIG=['leg-press','hack-squat','smith'];
function restFor(id){const m=M(id);if(m.cardio)return 0;return (REST[S.goal||'build']||75)+(BIG.includes(id)?30:0)+Math.max(0,...condActive().map(k=>CONDITIONS[k].rest||0));}
let restT=null,restLeft=0;
function fmtS(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0');}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.35);}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
function stopRest(){clearInterval(restT);restT=null;const b=document.getElementById('restbar');if(b)b.remove();}
function startRest(sec){stopRest();if(!sec)return;restLeft=sec;const bar=document.createElement('div');bar.className='restbar';bar.id='restbar';bar.setAttribute('role','timer');
  bar.innerHTML=`<span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase">Rest</span><b id="restleft">${fmtS(restLeft)}</b><button data-r="15">+15s</button><button data-r="skip">Skip</button>`;
  bar.addEventListener('click',e=>{const r=e.target.dataset.r;if(r==='skip')stopRest();else if(r){restLeft+=+r;document.getElementById('restleft').textContent=fmtS(restLeft);}});
  document.body.appendChild(bar);
  restT=setInterval(()=>{restLeft--;const el=document.getElementById('restleft');if(el)el.textContent=fmtS(restLeft);if(restLeft<=0){stopRest();beep();toast('Rest done. Next set');}},1000);}
let sessT=null;
function sessionClock(){clearInterval(sessT);if(!S.sess)return;sessT=setInterval(()=>{const el=document.getElementById('sessclock');if(el)el.textContent=fmtS((Date.now()-S.sess)/1000);else clearInterval(sessT);},1000);}

// Guided contrast protocol (Othership / Remedy Place style): heat, cold with breath pacing, rest, three rounds, then it logs itself.
const PROTOCOL=[{k:'heat',name:'Sauna',secs:12*60,cue:'Sit tall and breathe slowly through your nose. Leave early if you feel dizzy.'},{k:'cold',name:'Ice bath',secs:150,cue:'breath'},{k:'rest',name:'Rest',secs:300,cue:'Sit and let your body warm up on its own. Sip some water.'}];
let GD=null;
function guide(){closeSheet();GD={i:0,round:1,rounds:3,left:PROTOCOL[0].secs,paused:false,heat:0,cold:0};
  const o=document.createElement('div');o.id='guide';o.setAttribute('role','dialog');o.setAttribute('aria-label','Guided contrast protocol');document.body.appendChild(o);
  o.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const a=b.dataset.g;if(a==='pause'){GD.paused=!GD.paused;b.textContent=GD.paused?'Resume':'Pause';}else if(a==='skip'){beep();nextPhase();}else endGuide(false);});
  drawGuide();GD.t=setInterval(()=>{if(GD.paused)return;GD.left--;const k=PROTOCOL[GD.i].k;if(k==='heat')GD.heat++;if(k==='cold')GD.cold++;if(GD.left<=0){beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);nextPhase();}else drawGuide(true);},1000);}
function nextPhase(){GD.i++;if(GD.i>=PROTOCOL.length){GD.i=0;GD.round++;}
  if(GD.round>=GD.rounds&&PROTOCOL[GD.i].k==='rest'){endGuide(true);return;}
  GD.left=PROTOCOL[GD.i].secs;drawGuide();}
function drawGuide(tick){const o=$('#guide');if(!o)return;const ph=PROTOCOL[GD.i];const C=2*Math.PI*120;const off=C*(GD.left/ph.secs);const key=GD.i+'-'+GD.round;
  if(tick&&o.dataset.k===key){o.querySelector('#gtime').textContent=fmtS(GD.left);o.querySelector('#gring').style.strokeDashoffset=off;return;}
  o.dataset.k=key;o.className='guide '+ph.k;
  o.innerHTML=`<div class="gtop"><span class="tag">Round ${GD.round} of ${GD.rounds}</span><button class="btn ghost small" data-g="end">End</button></div>
  <div class="gmid"><p class="tag gk">${ph.k==='heat'?'Heat at 38°':ph.k==='cold'?'Cold at 38°':'Rest'}</p><h1>${ph.name}</h1>
   <div class="gring"><svg viewBox="0 0 260 260" aria-hidden="true"><circle cx="130" cy="130" r="120" class="gtrack"/><circle id="gring" cx="130" cy="130" r="120" class="gprog" style="stroke-dasharray:${C};stroke-dashoffset:${off}"/></svg>${ph.cue==='breath'?'<div class="breath"></div>':''}<b id="gtime">${fmtS(GD.left)}</b></div>
   <p class="gcue">${ph.cue==='breath'?'Breathe in for 4, out for 6. Long, slow breaths out keep you calm in the cold.':esc(ph.cue)}</p></div>
  <div class="row" style="gap:10px"><button class="btn ghost" style="flex:1" data-g="pause">${GD.paused?'Resume':'Pause'}</button><button class="btn" style="flex:1" data-g="skip">Next</button></div>`;}
function endGuide(done){clearInterval(GD.t);const hm=Math.round(GD.heat/60),cm=Math.round(GD.cold/60);const o=$('#guide');if(o)o.remove();
  if(hm)S.rec.push({r:'sauna',date:dayISO(0),mins:hm});if(cm)S.rec.push({r:'plunge',date:dayISO(0),mins:cm});GD=null;save();render();
  toast(hm||cm?`${done?'Protocol complete':'Saved'} · ${hm} min heat, ${cm} min cold logged`:'Protocol ended');}

// ---------- Live busy status (re-reads the clock every minute) ----------
function busyState(){const now=new Date();const d=now.getDay();const [o,c]=OPEN[d];const h=now.getHours()+now.getMinutes()/60;const open=h>=o&&h<c;
  const v=open?(busyCurve(d).find(x=>x[0]===now.getHours())||[0,0])[1]:0;
  // When closed, show the next opening day's prediction.
  const nd=open||h<o?d:(d+1)%7;const label=nd===d?'Today':'Tomorrow';
  return {open,L:busyLevel(v),d,nd,label,o,c,h};}
function busyPill(){const b=busyState();return `<button class="livepill" data-act="busyinfo" aria-label="Gym status"><span class="dot" style="background:${b.open?b.L.c:'var(--muted)'}"></span><span id="livetxt">${b.open?b.L.l+' now':'Closed now'}</span></button>`;}
function busyNowCard(){const b=busyState();

// Code 128 (set B). Bar/space widths for each symbol value 0-106.
const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function code128svg(txt){const vals=[104];for(const ch of txt){const c=ch.charCodeAt(0)-32;if(c<0||c>94)continue;vals.push(c);}
  let sum=104;for(let i=1;i<vals.length;i++)sum+=vals[i]*i;vals.push(sum%103);vals.push(106);
  let x=10,bars='';for(const v of vals){const w=C128[v];for(let i=0;i<w.length;i++){const n=+w[i];if(i%2===0)bars+=`<rect x="${x}" y="0" width="${n}" height="60"/>`;x+=n;}}
  return `<svg viewBox="0 0 ${x+10} 60" preserveAspectRatio="none" role="img" aria-label="Barcode ${esc(txt)}" style="width:100%;height:110px;display:block"><g fill="#000">${bars}</g></svg>`;}

// ================= Linked recovery model =================
// How each input changes recovery (shown to members behind the i buttons):
//  - Base time per muscle: RECOVERY_H (Brigatto 2019, Moran-Navarro 2017).
//  - Volume: each set above your goal's planned sets adds 8% (max +40%); a "hard" rating adds 25%.
//  - Sleep: under 6 h adds 12%, 6-7 h adds 5%, 8 h+ takes 3% off (sleep loss slows muscle repair: Dattilo 2011, Fullagar 2015).
//  - 38° heat: 0.5% faster per minute, up to 8% a session. Cold: 0.8% per minute, up to 10%. Massage: 10% a session
//    (Dupuy 2018 meta-analysis: massage was the most effective method for soreness and fatigue). Total boost capped at 20%.
//    Effects are modest on purpose: a 2026 trial (Bayne, J Thermal Biol) found heat and cold did not beat rest for strength recovery.
const HEAT_PER_MIN=.005,HEAT_CAP=.08,COLD_PER_MIN=.008,COLD_CAP=.1,MASSAGE_BOOST=.1,BOOST_CAP=.2;
const RECOVERY_INFO='How this is worked out. Each muscle has its own recovery time: biceps, calves and abs about 36 h, triceps 42 h, chest and shoulders 48 h, glutes 60 h, legs and back 72 h. Helper muscles count for half. Every set over your plan adds 6%, a hard session adds 25%, and short sleep adds up to 12%. After training, 38° heat speeds recovery by 0.5% per minute (up to 8%), cold by 0.8% per minute (up to 10%) and massage by 10%, up to 20% in total. We keep these effects small on purpose: in trials, heat and cold mostly help soreness, not strength. These are estimates from published research, not medical advice.';
function ritual(r){return RITUALS.find(x=>x.id===r.r)||{};}
function recMins(r){return r.mins||ritual(r).mins||0;}
function boostOf(r){const k=ritual(r).kind,m=recMins(r);return k==='heat'?Math.min(HEAT_CAP,m*HEAT_PER_MIN):k==='cold'?Math.min(COLD_CAP,m*COLD_PER_MIN):k==='massage'?MASSAGE_BOOST:0;}
function sleepOn(date){const v=(S.sleep||{})[date];if(v!=null)return v;if(S.wear&&date===dayISO(0))return WEAR_DEMO.sleep;return null;}
function sleepFactor(h){return h==null?1:h<6?1.12:h<7?1.05:h>=8?.97:1;}
function plannedSets(){return GOALS[S.goal||'build'].sets;}
function sessionLoad(l){const extra=l.sets.length-plannedSets();return Math.max(.88,Math.min(1.3,1+.06*extra))*(l.fb==='hard'?1.25:1);}
function hoursSince(l){return l.at?(Date.now()-l.at)/36e5:daysAgo(l.date)*24+12;}
function logBoost(l){return Math.min(BOOST_CAP,S.rec.filter(r=>r.date>=l.date&&daysAgo(l.date)-daysAgo(r.date)<=2&&(!l.at||!r.at||r.at>=l.at)).reduce((a,r)=>a+boostOf(r),0));}
function logSleep(l){const ds=[];for(let i=daysAgo(l.date)-1;i>=0;i--)ds.push(sleepOn(dayISO(i)));const v=ds.filter(x=>x!=null);return v.length?Math.min(...v):null;}
function recoveryDetail(){const out={};Object.keys(MUSCLES).forEach(k=>out[k]={pct:100,left:0});
  S.logs.forEach(l=>{const m=M(l.m);if(!m)return;const hrs=hoursSince(l);if(hrs>200)return;
    const mult=sessionLoad(l)*(m.cardio?.4:1)*sleepFactor(logSleep(l))*(1-logBoost(l));
    const hit=(k,share)=>{if(!out[k])return;const need=(RECOVERY_H[k]||48)*mult*share;const pct=Math.min(100,Math.round(hrs/need*100));if(pct<out[k].pct)out[k]={pct,left:Math.max(0,Math.round(need-hrs))};};
    m.muscles.forEach(k=>hit(k,1));(m.sec||[]).forEach(k=>hit(k,.5));});
  return out;}
function recovery(){const d=recoveryDetail();const o={};for(const k in d)o[k]=d[k].pct;return o;}
// What a single recovery session does, in words, for the toast and the info sheet.
function boostText(r){const b=Math.round(boostOf(r)*100);const recent=S.logs.some(l=>daysAgo(l.date)<=2&&!M(l.m).cardio);
  return recent?`speeds up muscles trained in the last 2 days by about ${b}%`:`no recent training to speed up, but it still counts toward your weekly goal`;}
// Muscles worked recently, weighted by sets (for the therapist view).
function workedRecently(days=4){const w={};Object.keys(MUSCLES).forEach(k=>w[k]={sets:0,last:null,hard:false});
  S.logs.filter(l=>daysAgo(l.date)<=days).forEach(l=>{const m=M(l.m);if(!m||m.cardio)return;const add=(k,f)=>{if(!w[k])return;w[k].sets+=l.sets.length*f;if(!w[k].last||l.date>w[k].last)w[k].last=l.date;if(l.fb==='hard')w[k].hard=true;};m.muscles.forEach(k=>add(k,1));(m.sec||[]).forEach(k=>add(k,.5));});
  return w;}

// ================= Body map (anatomical figure) =================
// Muscle outlines adapted from react-body-highlighter (MIT licence, (c) 2020 GV79).
function bodyMap(rec,mode){
  const col=k=>{if(!k)return '#2b2a27';if(mode==='worked'){const w=rec[k];return !w||!w.sets?'#2b2a27':w.sets>=8||w.hard?'#d6735f':w.sets>=4?'var(--heat)':'var(--gold)';}
    if(k==='d_front')return recCol(Math.min(rec.frontdelts,rec.sidedelts));if(k==='d_back')return recCol(Math.min(rec.reardelts,rec.sidedelts));return recCol(rec[k]);};
  const fig=(list,label)=>`<svg viewBox="0 0 100 220" role="img" aria-label="${label} view">${list.map(([k,ps])=>ps.map(p=>`<polygon points="${p}" fill="${col(k)}" fill-opacity="${k?'.85':'1'}" stroke="#090908" stroke-width=".6"/>`).join('')).join('')}<text x="50" y="216" text-anchor="middle">${label.toUpperCase()}</text></svg>`;
  const legend=mode==='worked'?`<div class="legend"><span><i style="background:var(--gold)"></i>Light</span><span><i style="background:var(--heat)"></i>Worked</span><span><i style="background:#d6735f"></i>Worked hard</span></div>`
    :`<div class="legend"><span><i style="background:var(--good)"></i>Fresh</span><span><i style="background:var(--heat)"></i>Recovering</span><span><i style="background:#d6735f"></i>Rest</span></div>`;
  let foot='';if(mode!=='worked'){const det=recoveryDetail();const low=Object.keys(MUSCLES).filter(k=>rec[k]<85).sort((a,b)=>rec[a]-rec[b]);
    foot=`<p class="muted" style="font-size:13px;text-align:center">${low.length?'Still recovering: '+low.map(k=>`${MUSCLES[k]} ${rec[k]}%${det[k].left?` <span style="opacity:.7">(~${det[k].left}h)</span>`:''}`).join(' · '):'Every muscle group is fresh and ready to train.'}</p>`;}
  return `<div class="bodymap">${fig(BODY.front,'Front')}${fig(BODY.back,'Back')}</div>${legend}${foot}`;}
function therapistSheet(){const w=workedRecently(4);const list=Object.keys(MUSCLES).filter(k=>w[k].sets>0).sort((a,b)=>w[b].sets-w[a].sets);
  const inj=(S.injuries||[]).map(k=>INJURIES[k]);
  openSheet(`<p class="tag">Show your therapist</p><h1 style="font-size:30px">Where I've been <em>working</em></h1><p class="muted" style="font-size:13px">The last 4 days of training at Beachouse, so your therapist knows where to focus.</p>
   ${bodyMap(w,'worked')}
   <div class="list">${list.length?list.map(k=>`<div class="item"><span><b>${MUSCLES[k]}</b><br><span class="meta">${Math.round(w[k].sets)} sets · last ${daysAgo(w[k].last)===0?'today':daysAgo(w[k].last)===1?'yesterday':daysAgo(w[k].last)+' days ago'}${w[k].hard?' · felt hard':''}</span></span><span class="pill" style="color:${w[k].sets>=8||w[k].hard?'#d6735f':'var(--heat)'};border-color:currentColor">${w[k].sets>=8||w[k].hard?'Likely sore':'Worked'}</span></div>`).join(''):'<div class="item muted">No training logged in the last 4 days.</div>'}</div>
   ${inj.length?`<p class="note heat">Injuries to work around: ${inj.join(', ')}.</p>`:''}`);}

// ================= "Because of what you logged" insights =================
function insights(){const out=[];const today=dayISO(0);const det=recoveryDetail();const ses=sessionItems();
  const add=(tone,title,body,why)=>out.push({tone,title,body,why});
  // Extra sets in the last 2 days
  const over=S.logs.filter(l=>daysAgo(l.date)<=1&&!M(l.m).cardio&&l.sets.length>plannedSets());
  if(over.length){const ms=[...new Set(over.flatMap(l=>M(l.m).muscles))].map(k=>MUSCLES[k].toLowerCase());
    add('heat','Extra sets logged',`You did more sets than planned on ${over.map(l=>M(l.m).name).join(', ')}. Your ${ms.join(', ')} need longer to recover, so aim for 8 hours' sleep and hit your protein today.`,'Each set over your plan adds about 8% to that muscle’s recovery time.');}
  // Today's session vs recovery
  const tired=ses.items.map(M).filter(m=>!m.cardio&&Math.min(...m.muscles.map(k=>det[k].pct))<60);
  if(tired.length)add('heat','Lighter on some machines today',`${tired.map(m=>m.name).join(', ')} work${tired.length>1?'':'s'} muscles that are still recovering, so their targets are 10% lighter today.`,'When a machine’s main muscle is under 60% recovered, the app lowers the target weight by 10%.');
  // Sleep
  const sl=sleepOn(today);if(sl!=null&&sl<7)add('heat','Short sleep',`${sl} hours last night slows recovery by ${sl<6?12:5}%. Keep today's session moderate and try to get to bed earlier.`,'Sleep loss reduces muscle repair and raises perceived effort (Fullagar 2015).');
  // Cold straight after weights when building muscle
  const lifts=S.logs.filter(l=>l.date===today&&l.at&&!M(l.m).cardio);const cold=S.rec.filter(r=>r.date===today&&r.at&&ritual(r).kind==='cold');
  if(['build','strength'].includes(S.goal||'build')&&lifts.length&&cold.some(c=>lifts.some(l=>c.at>l.at&&c.at-l.at<6*36e5)))
    add('cold','Ice bath straight after weights','Cold right after lifting can reduce muscle growth. For your goal, use heat after training and save the ice bath for rest days or 6+ hours later.','A 2024 meta-analysis (Piñero et al.) found cold water immersion straight after resistance training reduced muscle growth.');
  // Heat today adds water
  const heatToday=S.rec.filter(r=>r.date===today&&ritual(r).kind==='heat');
  if(heatToday.length)add('cold','Drink a bit more today',`Your ${heatToday.length>1?heatToday.length+' heat sessions':'heat session'} added ${(heatToday.length*.5).toFixed(1)} L to today's water target.`,'You sweat out roughly half a litre in a 15-minute sauna.');
  // Training load spike
  const lr=loadRatio();if(lr>1.25)add('heat','Big training week',`You've trained ${Math.round((lr-1)*100)}% more than your usual week, so your heat and cold goals went up.`,'Your recovery goals rise when this week’s training load is more than 25% above your 4-week average.');
  // Injuries
  if((S.injuries||[]).length)add('good','Working around your injuries',`Machines that load your ${(S.injuries||[]).map(k=>INJURIES[k].toLowerCase()).join(' and ')} are swapped out of your sessions.`,'Set or clear injuries in your profile.');
  // Recovery visit helped
  const recentBoost=S.rec.filter(r=>daysAgo(r.date)<=1&&boostOf(r)>0);
  if(recentBoost.length&&S.logs.some(l=>daysAgo(l.date)<=2&&!M(l.m).cardio))add('good','Recovery is working',`Your ${recentBoost.map(r=>ritual(r).name.toLowerCase()).join(' and ')} sped up recovery by about ${Math.round(Math.min(BOOST_CAP,recentBoost.reduce((a,r)=>a+boostOf(r),0))*100)}%.`,RECOVERY_INFO);
  if(S.glucoseFocus&&new Date().getHours()>=12&&new Date().getHours()<21)add('good','Walk after meals','A 10-minute walk after lunch or dinner lowers the blood sugar spike.','From your glucose monitor results.');
  // Food done
  const ft=foodTargets(),fd=foodToday();if(fd.p>=ft.palms&&fd.p>0)add('good','Protein target hit','That helps your muscles repair from today’s training.','Your protein target is based on your body weight and goal.');
  return out;}

const PROTOCOLS={
 beginner:{l:'Beginner',sauna:10,ice:1,rest:2,rounds:2,note:'New to heat and cold. Get used to the cold first.'},
 intermediate:{l:'Intermediate',sauna:15,ice:2,rest:5,rounds:3,note:'Done it a few times and the cold feels manageable.'},
 advanced:{l:'Advanced',sauna:20,ice:3,rest:5,rounds:3,note:'Regular bathhouse user, comfortable in the cold.'}
};
function protocolCard(){const k=S.proto||'beginner';const P=PROTOCOLS[k];
  return `<section class="card"><div class="row between"><h2>Contrast protocol${ib('Sauna at 80 to 90\u00b0C, then the ice bath at 3 to 6\u00b0C, then rest. Remember the numbers before you go in: the bathhouse is phone-free. Step out early if you feel dizzy, drink water between rounds, and skip the ice bath if you have a heart condition or high blood pressure unless your doctor has OK\u2019d it.')}</h2></div>
   <div class="seg" style="grid-template-columns:repeat(3,1fr)" role="group" aria-label="Level">${Object.entries(PROTOCOLS).map(([id,x])=>`<button data-proto="${id}" aria-pressed="${id===k}">${x.l}</button>`).join('')}</div>
   <div class="proto"><div><b>${P.sauna}</b><span class="heat">min sauna</span></div><i>\u2192</i><div><b>${P.ice}</b><span class="cold">min ice</span></div><i>\u2192</i><div><b>${P.rest}</b><span>min rest</span></div></div>
   <p class="proto-x">Repeat <b>${P.rounds}\u00d7</b> \u00b7 about ${(P.sauna+P.ice+P.rest)*P.rounds-P.rest} min</p>
   <p class="muted" style="font-size:13px;text-align:center">${P.note} Finish on cold to wake up, or on heat to wind down before bed.</p>
   <button class="btn gold block" data-act="logproto">I did this · log it</button></section>`;}
// ---------- Progress over time: everything members log is kept and charted ----------
function weeksBack(n){const out=[];const ws=new Date(weekStart()+'T00:00');for(let i=n-1;i>=0;i--){const d=new Date(ws);d.setDate(d.getDate()-7*i);out.push(isoLocal(d));}return out;}
function inWeek(date,wk){const e=new Date(wk+'T00:00');e.setDate(e.getDate()+7);return date>=wk&&date<isoLocal(e);}
function weekBars(series,weeks,unit){const max=Math.max(1,...weeks.map((w,i)=>series.reduce((a,s)=>a+s.v[i],0)));
  return `<div class="wbars" role="img" aria-label="Weekly chart">${weeks.map((w,i)=>`<div class="wb" title="Week of ${fmtDate(w)}">${series.map(s=>`<i style="height:${Math.round(s.v[i]/max*100)}%;background:${s.c}"></i>`).join('')}</div>`).join('')}</div>
  <div class="row between muted" style="font-size:10px"><span>${fmtDate(weeks[0])}</span><span>This week</span></div>
  ${series.length>1?`<div class="legend" style="justify-content:flex-start">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.l}</span>`).join('')}</div>`:''}`;}
function sinceStart(){const days=[...new Set(S.logs.map(l=>l.date))].sort();const first=[days[0],...(S.rec||[]).map(r=>r.date)].filter(Boolean).sort()[0];
  const kind=k=>S.rec.filter(r=>ritual(r).kind===k);
  return {first,sessions:days.length,tonnes:Math.round(S.logs.filter(l=>!M(l.m).cardio).reduce((a,l)=>a+vol(l),0)/100)/10,
    heat:kind('heat').reduce((a,r)=>a+recMins(r),0),cold:kind('cold').reduce((a,r)=>a+recMins(r),0),massage:kind('massage').length,
    foodDays:Object.values(S.food||{}).filter(d=>d.done).length,sleepNights:Object.keys(S.sleep||{}).length};}
function progressExtra(){const W=weeksBack(12);const st=sinceStart();
  const sess=W.map(w=>new Set(S.logs.filter(l=>inWeek(l.date,w)).map(l=>l.date)).size);
  const heat=W.map(w=>S.rec.filter(r=>inWeek(r.date,w)&&ritual(r).kind==='heat').reduce((a,r)=>a+recMins(r),0));
  const cold=W.map(w=>S.rec.filter(r=>inWeek(r.date,w)&&ritual(r).kind==='cold').reduce((a,r)=>a+recMins(r),0));
  const sl=W.map(w=>{const v=Object.entries(S.sleep||{}).filter(([d])=>inWeek(d,w)).map(([,h])=>h);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;});
  const food=W.map(w=>Object.entries(S.food||{}).filter(([d,x])=>inWeek(d,w)&&x.done).length);
  const avg=a=>{const v=a.filter(x=>x>0);return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length*10)/10:0;};
  return `<section class="card"><h2>Since you started${st.first?' \u00b7 '+fmtDate(st.first):''}${ib('Everything you log is kept on your phone and adds up here: training, heat, cold, massage, sleep and food.')}</h2>
   <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><b>${st.sessions}</b><span>Sessions</span></div><div class="stat"><b>${st.tonnes}</b><span>Tonnes lifted</span></div><div class="stat"><b>${st.heat}</b><span>Heat min</span></div><div class="stat"><b>${st.cold}</b><span>Cold min</span></div><div class="stat"><b>${st.massage}</b><span>Massages</span></div><div class="stat"><b>${st.foodDays}</b><span>Food days done</span></div></div></section>
  <section class="card"><div class="row between"><h2>Sessions per week</h2><span class="muted" style="font-size:12px">avg ${avg(sess)}</span></div>${weekBars([{v:sess,c:'var(--gold)',l:'Sessions'}],W)}</section>
  <section class="card"><div class="row between"><h2>Heat and cold per week</h2><span class="muted" style="font-size:12px">min</span></div>${weekBars([{v:heat,c:'var(--heat)',l:'Heat'},{v:cold,c:'var(--cold)',l:'Cold'}],W)}</section>
  <section class="card"><div class="row between"><h2>Sleep</h2><span class="muted" style="font-size:12px">${avg(sl)?'avg '+avg(sl)+' h a night':'Log sleep on Today'}</span></div>${weekBars([{v:sl,c:'#9b8fd6',l:'Hours'}],W)}</section>
  <section class="card"><div class="row between"><h2>Food guide days completed</h2><span class="muted" style="font-size:12px">of 7 each week</span></div>${weekBars([{v:food,c:'var(--good)',l:'Days'}],W)}</section>`;}
function recoverProgress(){const W=weeksBack(6);const tot=W.map(w=>S.rec.filter(r=>inWeek(r.date,w)&&boostOf(r)>0).length);const st=sinceStart();
  return `<section class="card"><div class="row between"><h2>Your recovery progress</h2><button class="muted" style="font-size:12px" data-act="toprogress">All progress \u203a</button></div>
   <div class="stats"><div class="stat"><b>${st.heat}</b><span>Heat min</span></div><div class="stat"><b>${st.cold}</b><span>Cold min</span></div><div class="stat"><b>${st.massage}</b><span>Massages</span></div></div>
   <span class="muted" style="font-size:12px">Recovery visits, last 6 weeks</span>${weekBars([{v:tot,c:'var(--gold)',l:'Visits'}],W)}</section>`;}
// ================= Extra health services: results feed back into training, recovery and food =================
const VO2_NORMS={m:[[29,[38,42,46,52]],[39,[36,40,44,50]],[49,[34,38,42,48]],[59,[31,35,39,45]],[200,[28,32,36,42]]],f:[[29,[31,35,39,45]],[39,[29,33,37,43]],[49,[27,31,35,41]],[59,[24,28,32,38]],[200,[21,25,29,35]]]};
function vo2Rating(v,age,sex){const row=(VO2_NORMS[sex==='f'?'f':'m']).find(r=>age<=r[0])[1];const L=['Needs work','Fair','Good','Excellent','Superior'];let i=0;while(i<4&&v>=row[i])i++;return {l:L[i],i};}
const SERVICES=[
 {id:'vo2',name:'VO2 max test',what:'Your aerobic fitness: how much oxygen your body uses at full effort. One of the strongest predictors of long-term health.',
  fields:[['v','VO2 max','ml/kg/min'],['age','Your age','years']],links:'Adds cardio finishers to your sessions to keep your VO2 max high when fitness is one of your goals.'},
 {id:'rmr',name:'Resting metabolism test',what:'How many calories your body burns at rest, measured from your breath. Takes the guesswork out of calorie targets.',
  fields:[['v','Resting metabolic rate','kcal/day']],links:'Adds a daily calorie guide to your food targets, matched to your goal.'},
 {id:'cgm',name:'Glucose monitor',what:'A 2-week sensor on your arm that tracks blood sugar around the clock, so you see how food, sleep and training affect you.',
  fields:[['avg','Average glucose','mmol/L'],['tir','Time in range (3.9–7.8)','%']],links:'Adds glucose-friendly food tips and walks after meals if your levels run high.'},
 {id:'physio',name:'Physio',what:'Assessment and treatment for injuries and niggles, plus a plan to get you back to full training.',
  fields:[['area','Area treated','',['shoulder','elbow','back','hip','knee']],['status','Physio says','',['avoid','cleared']],['rec','Physio\u2019s recommendations (optional)','',null,'text']],links:'Their recommendations swap machines out of your sessions and add the strengthening work they suggest.'},
 {id:'diet',name:'Dietitian',what:'A personalised eating plan from an accredited practising dietitian, for performance, body composition or health conditions.',
  fields:[['protein','Protein target','g/day'],['kcal','Calorie target','kcal/day']],links:'Your dietitian’s numbers replace the app’s general food targets.'}
];
const AREA_L={shoulder:'Shoulder',elbow:'Elbow or wrist',back:'Lower back',hip:'Hip',knee:'Knee'},STATUS_L={avoid:'Avoid loading it for now',cleared:'Cleared to train'};
function lastT(id){const a=((S.tests||{})[id]||[]).slice().sort((x,y)=>x.date<y.date?1:-1);return a[0];}
function prevT(id){const a=((S.tests||{})[id]||[]).slice().sort((x,y)=>x.date<y.date?1:-1);return a[1];}
function testLine(id,t){if(!t)return '';
  if(id==='vo2'){const r=vo2Rating(t.v,t.age||35,S.sex);return `${t.v} ml/kg/min · ${r.l} for your age`;}
  if(id==='rmr')return `${t.v} kcal at rest`;
  if(id==='cgm')return `Avg ${t.avg} mmol/L · ${t.tir}% in range`;
  if(id==='physio')return `${AREA_L[t.area]} \u00b7 ${STATUS_L[t.status]}${t.rec?' \u00b7 notes added':''}`;
  if(id==='diet')return `${t.protein?t.protein+' g protein':''}${t.protein&&t.kcal?' · ':''}${t.kcal?t.kcal+' kcal':''}`;return '';}
function trend(id){const a=lastT(id),b=prevT(id);if(!a||!b)return '';const k=id==='cgm'?'tir':'v';if(a[k]==null||b[k]==null)return '';const d=Math.round((a[k]-b[k])*10)/10;return d?` <span style="color:${d>0?'var(--good)':'var(--heat)'}">${d>0?'↑':'↓'} ${Math.abs(d)} since last</span>`:'';}
// Suggestions from these results, approved by the member (same flow as blood and DEXA).
function testSuggestions(){const out=[];const done=S.testDone||{};
  const v=lastT('vo2');if(v){const r=vo2Rating(v.v,v.age||35,S.sex);if(r.i<=1||(S.goal||'build')==='fit')out.push({id:'vo2-'+v.date,title:r.i<=1?'Build your aerobic fitness':'Keep your VO2 max high',why:`Your VO2 max is ${r.l.toLowerCase()} for your age${(S.goal||'build')==='fit'?' and fitness is one of your goals':''}.`,note:'Adds a 10-minute rower finisher to your sessions. Fitness improves fastest with 2 to 3 cardio sessions a week.',apply:()=>{S.planAdds=[...new Set((S.planAdds||[]).concat('rower'))];}});}
  const m=lastT('rmr');if(m){const kcal=Math.round(m.v*1.5*({fit:.85,build:1.1,strength:1.05}[S.goal||'build'])/50)*50;out.push({id:'rmr-'+m.date,title:`Calorie guide: about ${kcal} kcal a day`,why:`Resting burn ${m.v} kcal × 1.5 for an active day, adjusted for your goal (${GOALS[S.goal||'build'].label.toLowerCase()}).`,note:'Adds a calorie line to your food guide.',apply:()=>{S.kcal=kcal;}});}
  const g=lastT('cgm');if(g&&(g.avg>6.5||g.tir<90))out.push({id:'cgm-'+g.date,title:'Steadier blood sugar',why:`${g.tir<90?'Only '+g.tir+'% of your time was in range':'Your average glucose ran a little high'}.`,note:'Adds food tips (protein and veg first, fewer refined carbs) and a 10-minute walk after main meals, which lowers the spike.',apply:()=>{S.glucoseFocus=true;}});
  const p=lastT('physio');if(p){const pr=parsePhysio(p.rec);out.push({id:'physio-'+p.date,title:p.status==='avoid'?`Protect your ${AREA_L[p.area].toLowerCase()}`:`Back to full training: ${AREA_L[p.area].toLowerCase()}`,why:`Your physio says: ${STATUS_L[p.status].toLowerCase()}.`,note:(p.status==='avoid'?'Machines that load it are swapped out of your sessions.':'Machines for that area come back into your sessions.')+(pr.avoid.length?' Also swapped out from their notes: '+pr.avoid.map(id=>M(id).name).join(', ')+'.':'')+(pr.add.length?' Added from their notes: '+pr.add.map(id=>M(id).name).join(', ')+'.':''),apply:()=>{const inj=new Set(S.injuries||[]);p.status==='avoid'?inj.add(p.area):inj.delete(p.area);S.injuries=[...inj];S.physioAvoid=p.status==='avoid'?pr.avoid:[];S.planAdds=[...new Set((S.planAdds||[]).concat(pr.add))];}});}
  const d=lastT('diet');if(d&&(d.protein||d.kcal))out.push({id:'diet-'+d.date,title:'Use your dietitian’s targets',why:`${d.protein?d.protein+' g protein':''}${d.protein&&d.kcal?' and ':''}${d.kcal?d.kcal+' kcal':''} a day.`,note:'Replaces the app’s general food targets.',apply:()=>{if(d.protein)S.dietProtein=+d.protein;if(d.kcal)S.kcal=+d.kcal;}});
  return out.filter(x=>!done[x.id]);}
function servicesCard(){const sg=testSuggestions();
  return `<section class="stack"><div class="row between"><h2>More tests and services${ib('Book through our local partners and add your results here. Each result can suggest changes to your training, recovery or food, and nothing changes until you approve it.')}</h2></div>
   ${sg.length&&!SOON.services?`<section class="card" style="border-color:rgba(200,179,138,.5)"><div class="row between"><h2>Suggested from your tests</h2><span class="ai">Ready to apply</span></div>${sg.map(x=>`<div class="stack" style="gap:4px"><div class="row between"><b>${esc(x.title)}</b><button class="btn ghost small" data-tsok="${x.id}">Approve</button></div><span class="muted" style="font-size:13px">${esc(x.why)} ${esc(x.note)}</span></div>`).join('')}${sg.length>1?'<button class="btn block" data-act="tsall">Approve all</button>':''}</section>`:''}
   ${SOON.services?'<p class="muted" style="font-size:13px">We\u2019re lining up trusted local partners with member rates. These open soon.</p>':''}<div class="list${SOON.services?' soonlist':''}">${SERVICES.map(sv=>{const t=lastT(sv.id);return `<button class="item" data-svc="${sv.id}"><span><b>${sv.name}</b><br><span class="meta">${t?testLine(sv.id,t)+' · '+fmtDate(t.date)+trend(sv.id):esc(sv.links)}</span></span><span class="chev">›</span></button>`}).join('')}</div></section>`;}
function serviceSheet(id){const sv=SERVICES.find(x=>x.id===id);const hist=((S.tests||{})[id]||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const inp='style="background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:12px;color:var(--fg);font:inherit;width:100%;min-width:0"';

    ${sv.fields.map(([k,l,u,opts,typ])=>typ==='text'?`<label class="stack" style="gap:4px"><span class="tag" style="color:var(--muted)">${l}</span><textarea id="sv_${k}" rows="3" placeholder="e.g. Avoid overhead pressing for 4 weeks. Strengthen glutes and rotator cuff." ${inp}></textarea></label>`:opts?`<label class="stack" style="gap:4px"><span class="tag" style="color:var(--muted)">${l}</span><select id="sv_${k}" ${inp}>${opts.map(o=>`<option value="${o}">${(k==='area'?AREA_L:STATUS_L)[o]}</option>`).join('')}</select></label>`:`<label class="stack" style="gap:4px"><span class="tag" style="color:var(--muted)">${l}${u?' ('+u+')':''}</span><input id="sv_${k}" inputmode="decimal" ${inp}></label>`).join('')}
    <button class="btn block" id="svsave">Save result</button></div>
   ${hist.length?`<div class="stack"><h2>Your results</h2><div class="list">${hist.map(t=>`<div class="item"><span>${testLine(id,t)}</span><span class="meta">${fmtDate(t.date)}</span></div>`).join('')}</div></div>`:''}`,
  s=>{s.querySelector('#svbook').onclick=()=>toast('Partner booking is coming soon. We’ll let you know when it’s live');
    s.querySelector('#svsave').onclick=()=>{const r={date:s.querySelector('#svd').value||dayISO(0)};for(const [k,,,opts,typ] of sv.fields){const v=s.querySelector('#sv_'+k).value.trim();if(typ==='text'){r[k]=v;continue;}if(!v){toast('Fill in every field');return;}r[k]=opts?v:parseFloat(v);if(!opts&&isNaN(r[k])){toast('Numbers only, please');return;}}
      S.tests=S.tests||{};(S.tests[id]=S.tests[id]||[]).push(r);save();closeSheet();render();toast(testSuggestions().length?'Saved. Check your suggestions to apply it':'Saved');};});}
function applyTests(ids){const sg=testSuggestions().filter(x=>ids.includes(x.id));if(!sg.length)return;S.testDone=S.testDone||{};sg.forEach(x=>{x.apply();S.testDone[x.id]=true;});save();render();toast(sg.length>1?'All applied':'Applied');}

  return `<section class="card"><div class="row between"><h2>How do you feel today?</h2></div>

const CHECKQ=[['energy','Energy this week',['Low','OK','Great']],['sore','Soreness',['Very sore','A bit','Fresh']],['sleepq','Sleep quality',['Poor','OK','Good']],['stress','Stress',['High','Medium','Low']],['motiv','Motivation',['Low','OK','High']]];
function reviewWeek(){const d=new Date().getDay();const ws=new Date(weekStart()+'T00:00');if(d===1)ws.setDate(ws.getDate()-7);return isoLocal(ws);}
function checkinDue(){const k=reviewWeek();const d=new Date().getDay();return !(S.checkins||{})[k]&&(d===0||d===1||S.example);}
function weekStats(ws){const e=new Date(ws+'T00:00');e.setDate(e.getDate()+7);const end=isoLocal(e);const inW=d=>d>=ws&&d<end;
  const sl=Object.entries(S.sleep||{}).filter(([d])=>inW(d)).map(([,h])=>h);
  return {sessions:new Set(S.logs.filter(l=>inW(l.date)).map(l=>l.date)).size,sleep:sl.length?Math.round(sl.reduce((a,b)=>a+b,0)/sl.length*10)/10:null,
    heat:S.rec.filter(r=>inW(r.date)&&ritual(r).kind==='heat').reduce((a,r)=>a+recMins(r),0),cold:S.rec.filter(r=>inW(r.date)&&ritual(r).kind==='cold').reduce((a,r)=>a+recMins(r),0),
    massage:S.rec.filter(r=>inW(r.date)&&ritual(r).kind==='massage').length,extra:S.logs.filter(l=>inW(l.date)&&!M(l.m).cardio&&l.sets.length>plannedSets()).length,
    food:Object.entries(S.food||{}).filter(([d,x])=>inW(d)&&x.done).length};}
function checkinFeedback(a,w,p){const out=[];const days=S.days||3;
  if(w.sessions>=days)out.push(`You trained ${w.sessions} times, hitting your ${days}-day target${w.sessions>p.sessions?`, up from ${p.sessions} last week`:''}.${a.energy==='Great'?' That consistency is probably why you feel good.':''}`);
  else out.push(`You trained ${w.sessions} of your ${days} days. ${a.motiv==='Low'?'Try a new routine or book a session with a coach to freshen things up.':'Plan your sessions into your calendar for next week.'}`);
  if(w.sleep!=null&&p.sleep!=null&&w.sleep<p.sleep-0.2)out.push(`Your sleep averaged ${w.sleep} h, down from ${p.sleep} h. ${a.energy==='Low'?'That’s likely why your energy is low. ':''}Make an effort to get to bed earlier next week.`);
  else if(w.sleep!=null&&w.sleep<7)out.push(`Your sleep averaged ${w.sleep} h. Aim for 7 to 9 hours: it’s the quickest way to more energy and faster recovery.`);
  else if(w.sleep!=null)out.push(`Good sleep: ${w.sleep} h a night on average${p.sleep!=null&&w.sleep>p.sleep?`, up from ${p.sleep} h`:''}. Keep it up.`);
  if(a.sore==='Very sore'){if(w.extra)out.push(`You did extra sets ${w.extra} time${w.extra>1?'s':''}, which is likely why you’re sore.`);if(w.heat+w.cold<30||!w.massage)out.push(`Only ${w.heat} min heat and ${w.cold} min cold${w.massage?'':' and no massage'} this week. Add a contrast session or book a massage.`);}
  else if(a.sore==='Fresh'&&w.heat+w.cold>=40)out.push(`${w.heat} min heat and ${w.cold} min cold this week: your recovery work is paying off.`);
  if(a.stress==='High')out.push('Stress is high. The Silent Session and longer sauna sessions are great for switching off, and keep training moderate this week.');
  if(w.food<3)out.push(`You completed the food guide on ${w.food} day${w.food===1?'':'s'}. Hitting your protein helps recovery and energy.`);
  return out;}

const PHYSIO_RULES=[[/overhead|shoulder press|above (your )?head/i,['shoulder-press','lateral'],[]],[/squat|lunge|deep knee|leg press|knee bend/i,['hack-squat','smith','leg-press'],[]],[/leg extension|knee extension/i,['leg-ext'],[]],
 [/deadlift|hinge|rdl|bending|lifting from the floor/i,['rdl','back-ext'],[]],[/bench|push.?up|chest press|pressing/i,['chest-press'],[]],[/pull.?up|hanging|lat pull/i,['assist-pull','lat-pull'],[]],[/crunch|sit.?up|spinal flexion/i,['ab-crunch','cable-crunch'],[]],
 [/glute|hip strength/i,[],['hip-thrust','abductor']],[/hamstring/i,[],['leg-curl']],[/rotator|rear delt|posture|upper back|scapula/i,[],['rear-delt','seated-row']],[/calf|ankle/i,[],['calf']],[/quad|vmo/i,[],['leg-ext']]];
function parsePhysio(txt){const avoid=new Set(),add=new Set();String(txt||'').split(/[.;\n]+/).forEach(sent=>{const neg=/avoid|no |don'?t|do not|stop|skip|not |hold off|limit/i.test(sent);
  PHYSIO_RULES.forEach(([re,av,ad])=>{if(re.test(sent)){if(neg)av.concat(ad).forEach(x=>avoid.add(x));else{ad.forEach(x=>add.add(x));}}});});
  [...avoid].forEach(x=>add.delete(x));return {avoid:[...avoid],add:[...add]};}

async function startCam(s){
  const v=s.querySelector('#cam');const c=document.createElement('canvas');const ctx=c.getContext('2d',{willReadFrequently:true});
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){s.querySelector('#camMsg').textContent='Camera not available. Pick the machine below.';v.hidden=true;return;}
  v.srcObject=stream;await v.play();
  const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
  const tick=async()=>{if(!stream||!document.body.contains(v))return stopCam();
    let txt=null;
    try{if(det){const r=await det.detect(v);if(r[0])txt=r[0].rawValue;}else if(window.jsQR&&v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;ctx.drawImage(v,0,0);const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r)txt=r.data;}}catch(e){}
    const id=txt&&idFromQR(txt);if(id){stopCam();machineSheet(id);return;}
    requestAnimationFrame(tick);};
  tick();
}

  else if(t.dataset.rdel){const r=routineById(t.dataset.rdel);if(r&&confirm('Delete '+r.name+'?')){S.routines=routines().filter(x=>x!==r);if(S.plan==='r:'+r.id){S.plan='start';S.planDay=0;}save();render();}}
  else if(t.dataset.rstart){const r=routineById(t.dataset.rstart);S.plan='r:'+r.id;S.planDay=0;save();render();toast(r.name+' is now Today\'s session');}
  else if(t.dataset.rx){const [rid,ix]=t.dataset.rx.split(':');const r=routineById(rid);r.items.splice(+ix,1);save();render();}
  else if(t.dataset.goal){S.goal=t.dataset.goal;save();render();toast('Goal set: '+GOALS[S.goal].label);}
  else if(t.dataset.plan){S.plan=t.dataset.plan;S.planDay=0;save();render();toast('Plan started');}
  else if(t.dataset.prog){progM=t.dataset.prog;render();}
  else if(t.dataset.rit){{const R=RITUALS.find(r=>r.id===t.dataset.rit);if(R.kind==='cold'&&condFlag('noCold')&&!confirm('Ice baths are paused for your health condition. Log it anyway?'))return;const e={r:R.id,date:dayISO(0),mins:R.mins,at:Date.now()};S.rec.push(e);save();render();toast(`${R.name} logged: ${boostText(e)}`);}}
  else if(t.dataset.act==='scan')scanSheet();
  else if(t.dataset.act==='startsess'){S.sess=Date.now();save();render();sessionClock();toast('Session started');}
  else if(t.dataset.act==='nextday'){const mins=S.sess?Math.round((Date.now()-S.sess)/60000):0;S.sess=null;S.planDay++;stopRest();save();render();summarySheet(mins);}
  else if(t.dataset.act==='bw')bwSheet();
  else if(t.dataset.cv){clubView=t.dataset.cv;render();}
  else if(t.dataset.bd){busyDay=+t.dataset.bd;render();}
  else if(t.dataset.act==='suspend')suspendSheet();
  else if(t.dataset.act==='days')daysSheet();
  else if(t.dataset.wear){S.wear=t.dataset.wear;save();render();toast(DEVICES[S.wear]+' connected (example data)');}
  else if(t.dataset.act==='unwear'){S.wear=null;save();render();}
  else if(t.dataset.act==='addwear')wearSheet();
  else if(t.dataset.hv){healthView=t.dataset.hv;render();}

  else if(t.dataset.act==='gohealth'){tab='medical';healthView='results';render();window.scrollTo(0,0);}
  else if(t.dataset.act==='applyres'){const lt=lastTest();S.applied=Object.assign({},S.applied,{[lt.date]:true});save();render();toast('Training, recovery and food updated');}
  else if(t.dataset.act==='unapply'){const lt=lastTest();S.applied=Object.assign({},S.applied);delete S.applied[lt.date];save();render();toast('Changes undone');}
  else if(t.dataset.fd){const k=t.dataset.fd;const st=+(t.dataset.fs||1);S.food=S.food||{};const d=S.food[dayISO(0)]=Object.assign({p:0,v:0,f:0,w:0},S.food[dayISO(0)]);d[k]=Math.max(0,Math.round((d[k]+st*(k==='w'?0.25:1))*100)/100);save();render();const ft=foodTargets();d.done=d.p>=ft.palms&&d.v>=ft.veg&&d.f>=ft.fruit&&d.w>=ft.water;save();if(st>0&&d.done)toast('Food guide complete for today. Come back tomorrow','pr');}
  else if(t.dataset.dxa)applyDexa([t.dataset.dxa]);
  else if(t.dataset.act==='dxall')applyDexa(dexaSuggestions().map(x=>x.id));
  else if(t.dataset.act==='dxreset'){S.planAdds=[];S.dexaDone=[];save();render();toast('Plan changes undone');}
  else if(t.dataset.act==='coach')coachSheet();
  else if(t.dataset.pv){progView=t.dataset.pv;render();}
  else if(t.dataset.act==='orderblood')orderSheet();
  else if(t.dataset.act==='addblood')addBloodSheet();
  else if(t.dataset.act==='adddexa')addDexaSheet();
  else if(t.dataset.act==='dexainfo')toast('DEXA booking with our partner clinic is coming soon');
  else if(t.dataset.period){S.period=t.dataset.period;save();render();}
  else if(t.dataset.act==='copywifi'){navigator.clipboard.writeText(WIFI.pass).then(()=>toast('Password copied'),()=>toast(WIFI.pass));}
  else if(t.id==='avatarBtn'||t.dataset.act==='profile')profileSheet();
});

function infoPop(txt){const o=document.createElement('div');o.className='sheet';o.style.zIndex=40;o.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><p style="font-size:15px;line-height:1.55">${txt}</p><button class="btn block">Got it</button></div>`;o.addEventListener('click',e=>{if(e.target===o||e.target.closest('button'))o.remove();});document.body.appendChild(o);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-info]');if(b){e.stopPropagation();e.preventDefault();infoPop(b.dataset.info);}},true);
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(VIEWS[h]&&h!==tab){tab=h;render();}});
render();
if(deep&&M(deep)){history.replaceState(null,'',location.pathname);setTimeout(()=>machineSheet(deep),950);}
loadEvents();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>{const s=$('#splash');s.style.opacity='0';setTimeout(()=>s.remove(),700);},900);
})();
</script>

</body>
</html>
